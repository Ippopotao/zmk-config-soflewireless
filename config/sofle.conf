# ============================================================
# Display aktivieren
# ============================================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ============================================================
# WPM (Wörter pro Minute)
# ============================================================
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y

# ============================================================
# Batterie
# ============================================================
CONFIG_ZMK_BATTERY_REPORTING=y

# ============================================================
# nice!view (ePaper-Modus) — WICHTIG für nice!view!
# ============================================================
CONFIG_NICE_EPAPER_ON=y
CONFIG_NICE_OLED_ON=n

# ============================================================
# Layer-Anzeige
# ============================================================
CONFIG_NICE_OLED_WIDGET_LAYER=y

# ============================================================
# Peripherie (rechtes Display) — statisches Bild
# ============================================================
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=n

# ============================================================
# Performance / Stabilität
# ============================================================
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# ============================================================
# WICHTIG: ZMK v0.3.0 in west.yml pinnen!
# revision: v0.3.0 statt main — Pflicht für zmk-nice-oled
# ============================================================
